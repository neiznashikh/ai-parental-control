plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aiparental.control'
    compileSdk 33

    defaultConfig {
        applicationId "com.aiparental.control"
        minSdk 24
        targetSdk 33
        versionCode 6
        versionName "1.3"
    }

    // Постоянный ключ подписи: новые версии ставятся поверх старой, данные сохраняются
    signingConfigs {
        shared {
            storeFile file("learn2unlock.keystore")
            storePassword "learn2unlock"
            keyAlias "learn2unlock"
            keyPassword "learn2unlock"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
