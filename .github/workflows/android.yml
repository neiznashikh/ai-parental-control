name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Learn2Unlock-AI.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Learn2Unlock-AI-APK
          path: Learn2Unlock-AI.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Сборка #${{ github.run_number }}"
          body: |
            Скачайте файл Learn2Unlock-AI.apk ниже и установите на телефон.
          files: Learn2Unlock-AI.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
